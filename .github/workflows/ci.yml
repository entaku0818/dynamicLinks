name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        # firebase-admin がビルド時に PEM 秘密鍵を解析するため、ダミーの鍵を生成して渡す
        run: |
          export FIREBASE_ADMIN_PRIVATE_KEY="$(openssl genrsa 2048)"
          npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-dummy
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000:web:ci-dummy"
          FIREBASE_ADMIN_CLIENT_EMAIL: ci-dummy@ci-dummy.iam.gserviceaccount.com
          STRIPE_SECRET_KEY: sk_test_dummy

  ios-sdk:
    name: iOS SDK (SwiftPM)
    runs-on: macos-15
    defaults:
      run:
        working-directory: DynamicLinkSDK
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          which swiftlint || brew install swiftlint
          swiftlint lint
      - name: Build & Test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "Using simulator: $DEVICE"
          xcodebuild -scheme DynamicLinkSDK -destination "platform=iOS Simulator,name=$DEVICE" test

  android-sdk:
    name: Android SDK (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AndroidDynamicLinkSDK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, Test & Lint
        run: ./gradlew :sdk:testDebugUnitTest :sdk:lintDebug :sdk:assembleRelease

  sample-ios:
    name: Sample iOS App (Xcode)
    runs-on: macos-15
    defaults:
      run:
        working-directory: sample/sampleProject
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: |
          which swiftlint || brew install swiftlint
          swiftlint lint
      - name: Build & Test (unit tests only)
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "Using simulator: $DEVICE"
          xcodebuild \
            -scheme sampleProject \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -skip-testing:sampleProjectUITests \
            test
